[platformio]
src_dir = examples/BasicMouse

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_extra_dirs = .
lib_deps = 
    SPI
    https://github.com/T-vK/ESP32-BLE-Mouse